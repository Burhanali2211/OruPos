# ==============================================================================
# OruPos Production Nginx Configuration
# Main Website: orupos.in (Next.js Node app via PM2 on port 3000)
# Subdomains:   *.orupos.in (Dynamic Svelte/Static restaurant websites)
# ==============================================================================

# Enable Gzip Compression for blazing fast delivery
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_vary on;
gzip_min_length 1024;

# ------------------------------------------------------------------------------
# 1. Main Website: orupos.in and www.orupos.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name orupos.in www.orupos.in;

    # If you use Cloudflare SSL or Certbot SSL, cert directives will be added here
    # For now, HTTP traffic is forwarded to the Next.js process running on port 3000

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. Dynamic Restaurant Subdomains: *.orupos.in (e.g. spiceroute.orupos.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.orupos\.in$;

    # Exclude www (handled in block 1)
    if ($subdomain = "www") {
        return 301 https://orupos.in$request_uri;
    }

    # Strict Directory Check:
    # Path where each restaurant Svelte/HTML 'dist' folder is dropped
    set $restaurant_root /var/www/restaurants/$subdomain/dist;

    # GATING: If you have NOT created this restaurant folder,
    # reject random subdomains and immediately redirect them to orupos.in!
    if (!-d $restaurant_root) {
        return 302 https://orupos.in;
    }

    # If the folder exists, serve their Svelte website!
    root $restaurant_root;
    index index.html;

    # SPA Routing (works for SvelteKit, Svelte Vite, Vue, React, Plain HTML)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache (images, CSS, JS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
