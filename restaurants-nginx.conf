server {
    listen 80;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.orupos\.in$;

    # Exclude root or www if matched
    if ($subdomain = "www") {
        return 301 https://orupos.in$request_uri;
    }

    set $restaurant_root /var/www/restaurants/$subdomain/dist;

    # GATING: If you have NOT created this restaurant folder,
    # reject random subdomains and immediately redirect them to orupos.in!
    if (!-d $restaurant_root) {
        return 302 https://orupos.in;
    }

    # If the folder exists, serve their Svelte/static website!
    root $restaurant_root;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
