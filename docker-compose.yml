services:
  # 1. Main Next.js Website: orupos.in & www.orupos.in
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orupos-web
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orupos.rule=Host(`orupos.in`) || Host(`www.orupos.in`)"
      - "traefik.http.routers.orupos.entrypoints=websecure"
      - "traefik.http.routers.orupos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.orupos.priority=1"
      - "traefik.http.services.orupos.loadbalancer.server.url=http://127.0.0.1:3002"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - oru_default

  # 2. Dynamic Restaurant Subdomains: *.orupos.in (Svelte/Static websites)
  restaurants:
    image: nginx:alpine
    container_name: orupos-restaurants
    restart: always
    ports:
      - "127.0.0.1:3003:80"
    volumes:
      - ./restaurants-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /docker/restaurants:/var/www/restaurants:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orupos-subdomains.rule=HostRegexp(`{subdomain:[a-zA-Z0-9_-]+}.orupos.in`) && !Host(`orupos.in`) && !Host(`www.orupos.in`)"
      - "traefik.http.routers.orupos-subdomains.entrypoints=websecure"
      - "traefik.http.routers.orupos-subdomains.tls.certresolver=cloudflare"
      - "traefik.http.routers.orupos-subdomains.priority=10"
      - "traefik.http.services.orupos-subdomains.loadbalancer.server.url=http://127.0.0.1:3003"
    networks:
      - default
      - oru_default

networks:
  oru_default:
    external: true
